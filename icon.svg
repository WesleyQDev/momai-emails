<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <filter id="envShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="80%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Sombra no chão -->
  <ellipse cx="16" cy="28.5" rx="11" ry="2" fill="#000000" opacity="0.4" />

  <g filter="url(#envShadow2)">
    <!-- Corpo base do envelope -->
    <rect x="3.5" y="7" width="25" height="19" rx="3.5" fill="url(#bodyGrad)" stroke="#1D4ED8" stroke-width="0.8" />

    <!-- Vincos das dobras inferiores -->
    <path d="M4 25L13.5 17" stroke="#1E40AF" stroke-width="1.2" opacity="0.8" />
    <path d="M28 25L18.5 17" stroke="#1E40AF" stroke-width="1.2" opacity="0.8" />

    <!-- Aba superior dobrada com volume e sombra projetada -->
    <path d="M3.8 8.5C3.8 7.4 4.7 6.5 5.8 6.5H26.2C27.3 6.5 28.2 7.4 28.2 8.5L16.9 17.8C16.4 18.2 15.6 18.2 15.1 17.8L3.8 8.5Z" fill="url(#flapGrad)" />

    <!-- Filete de luz na borda da aba -->
    <path d="M5.5 7.5L15.4 16.5C15.8 16.8 16.2 16.8 16.6 16.5L26.5 7.5" stroke="#93C5FD" stroke-width="0.8" stroke-linecap="round" opacity="0.85" />

    <!-- Selo digital luminoso no centro -->
    <circle cx="16" cy="18" r="3.2" fill="url(#sealGrad)" />
    <circle cx="16" cy="18" r="1.4" fill="#FFFFFF" />
  </g>
</svg>
